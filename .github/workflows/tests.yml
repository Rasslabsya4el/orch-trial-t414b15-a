name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: write the placeholder for the private data file
        run: |
          mkdir -p data
          printf 'STUB 1\n' > data/stub.txt
      - run: python -m pip install -q pytest
      - name: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/src/orch_it/testruns/pytest_plugin
          ORCH_IT_PLACEHOLDERS: ${{ vars.ORCH_IT_PLACEHOLDERS }}
          T414B_DATA: data/stub.txt
        run: python -m pytest -q -p orch_it_ids --junitxml=junit.xml t414b
      - name: junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ github.run_attempt }}
          path: junit.xml
